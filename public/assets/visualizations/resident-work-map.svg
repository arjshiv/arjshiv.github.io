<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">From a resident message to owned work</title>
  <desc id="desc">Resident messages from several channels join the lease, policy, unit, and message history before a property team chooses and owns the next action.</desc>
  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#113331" flood-opacity="0.10"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#113331" stroke-opacity="0.055"/>
    </pattern>
  </defs>
  <rect width="1200" height="560" rx="22" fill="#e8f5f2"/>
  <rect width="1200" height="560" rx="22" fill="url(#grid)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="56" fill="#08746d" font-size="15" font-weight="700" letter-spacing="2">WHAT THE RESIDENT SAID</text>
    <text x="462" y="56" fill="#08746d" font-size="15" font-weight="700" letter-spacing="2">WHAT THE TEAM KNOWS</text>
    <text x="914" y="56" fill="#08746d" font-size="15" font-weight="700" letter-spacing="2">WHAT HAPPENS NEXT</text>
  </g>

  <g fill="none" stroke="#72bcb5" stroke-width="3" stroke-linecap="round">
    <path d="M274 140C344 140 354 228 444 228"/>
    <path d="M274 222C354 222 364 244 444 244"/>
    <path d="M274 304C354 304 364 260 444 260"/>
    <path d="M274 386C344 386 354 276 444 276"/>
    <path d="M756 252C842 252 842 176 918 176"/>
    <path d="M756 252C842 252 842 268 918 268"/>
    <path d="M756 252C842 252 842 360 918 360"/>
  </g>

