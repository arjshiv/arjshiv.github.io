    <g transform="translate(56 108)">
      <rect width="218" height="64" rx="8" fill="#f8fcfb" stroke="#9acdc7"/>
      <circle cx="28" cy="32" r="9" fill="#56c7ba"/>
      <text x="51" y="38" fill="#113331" font-size="18" font-weight="650">Text message</text>
    </g>
    <g transform="translate(56 190)">
      <rect width="218" height="64" rx="8" fill="#f8fcfb" stroke="#9acdc7"/>
      <rect x="20" y="23" width="17" height="17" rx="4" fill="#83d9a8"/>
