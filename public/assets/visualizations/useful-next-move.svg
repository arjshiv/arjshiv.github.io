<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Turning a team problem into a useful next move</title>
  <desc id="desc">A decision map connects what happened, what the team knows, who owns the problem, and what changes next.</desc>
  <defs>
    <filter id="move-lift" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#113331" flood-opacity="0.10"/>
    </filter>
    <pattern id="move-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#113331" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="560" rx="22" fill="#e8f5f2"/>
  <rect width="1200" height="560" rx="22" fill="url(#move-grid)"/>

  <g fill="none" stroke="#79bdb5" stroke-width="3" stroke-linecap="round">
    <path d="M374 156C462 156 458 236 526 252"/>
    <path d="M826 156C738 156 742 236 674 252"/>
    <path d="M374 406C462 406 458 326 526 310"/>
    <path d="M826 406C738 406 742 326 674 310"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" filter="url(#move-lift)">
    <g transform="translate(78 96)">
      <path d="M0 18L18 0H294L312 18V102L294 120H18L0 102Z" fill="#f8fcfb" stroke="#9acdc7"/>
      <circle cx="40" cy="40" r="10" fill="#56c7ba"/>
      <text x="62" y="45" fill="#4e6b67" font-size="14" font-weight="700" letter-spacing="1.5">01</text>
      <text x="40" y="84" fill="#113331" font-size="22" font-weight="720">What happened?</text>
    </g>
    <g transform="translate(810 96)">
      <path d="M0 18L18 0H294L312 18V102L294 120H18L0 102Z" fill="#f8fcfb" stroke="#9acdc7"/>
      <circle cx="40" cy="40" r="10" fill="#78bfd7"/>
      <text x="62" y="45" fill="#4e6b67" font-size="14" font-weight="700" letter-spacing="1.5">02</text>
      <text x="40" y="84" fill="#113331" font-size="22" font-weight="720">What do we know?</text>
    </g>
    <g transform="translate(78 346)">
      <path d="M0 18L18 0H294L312 18V102L294 120H18L0 102Z" fill="#f8fcfb" stroke="#9acdc7"/>
      <circle cx="40" cy="40" r="10" fill="#83d9a8"/>
      <text x="62" y="45" fill="#4e6b67" font-size="14" font-weight="700" letter-spacing="1.5">03</text>
      <text x="40" y="84" fill="#113331" font-size="22" font-weight="720">Who owns it?</text>
    </g>
    <g transform="translate(810 346)">
      <path d="M0 18L18 0H294L312 18V102L294 120H18L0 102Z" fill="#f8fcfb" stroke="#9acdc7"/>
      <circle cx="40" cy="40" r="10" fill="#b4d978"/>
      <text x="62" y="45" fill="#4e6b67" font-size="14" font-weight="700" letter-spacing="1.5">04</text>
      <text x="40" y="84" fill="#113331" font-size="22" font-weight="720">What changes next?</text>
    </g>
  </g>

  <g transform="translate(480 202)" filter="url(#move-lift)" font-family="Arial, Helvetica, sans-serif">
    <path d="M120 0L240 48L120 96L0 48Z" fill="#c9eee0" stroke="#08746d" stroke-width="2"/>
    <path d="M0 48L120 96V164L0 116Z" fill="#9ed9bf" stroke="#08746d" stroke-width="2"/>
    <path d="M240 48L120 96V164L240 116Z" fill="#79c4a4" stroke="#08746d" stroke-width="2"/>
    <circle cx="120" cy="51" r="19" fill="#113331"/>
    <path d="M111 51L118 58L131 43" fill="none" stroke="#e8f5f2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="124" text-anchor="middle" fill="#113331" font-size="18" font-weight="750">NEXT USEFUL</text>
    <text x="120" y="147" text-anchor="middle" fill="#113331" font-size="18" font-weight="750">MOVE</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="54" fill="#08746d" font-size="15" font-weight="700" letter-spacing="2">SUPPORTIVE CANDOR</text>
    <text x="1140" y="520" text-anchor="end" fill="#4e6b67" font-size="15">Take the pain seriously. Make the work specific.</text>
  </g>
</svg>
