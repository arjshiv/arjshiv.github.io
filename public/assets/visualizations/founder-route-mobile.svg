<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" role="img" aria-labelledby="title desc">
  <title id="title">A route from physics to ResiDesk</title>
  <desc id="desc">Four connected stations show how measurement led to trusted tools, outcomes in the product, and customer conversations.</desc>
  <defs>
    <filter id="r-lift" x="-25%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#113331" flood-opacity="0.11"/></filter>
    <pattern id="r-grid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#113331" opacity="0.08"/></pattern>
  </defs>
  <rect width="640" height="900" rx="20" fill="#eaf6f3"/><rect width="640" height="900" rx="20" fill="url(#r-grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="52" fill="#08746d" font-size="16" font-weight="700" letter-spacing="2">THE WORK CHANGED</text>
    <text x="40" y="88" fill="#113331" font-size="28" font-weight="720">The habit stayed useful.</text>
    <path d="M154 160C486 224 140 362 480 434C150 512 492 650 166 728" fill="none" stroke="#9dcec8" stroke-width="20" stroke-linecap="round"/>
    <path d="M154 160C486 224 140 362 480 434C150 512 492 650 166 728" fill="none" stroke="#08746d" stroke-width="3" stroke-dasharray="7 11"/>
    <g filter="url(#r-lift)">
      <g transform="translate(92 120)"><path d="M44 0L116 30L72 60L0 30Z" fill="#d5efe9" stroke="#72bcb5"/><path d="M0 30L72 60V100L0 70Z" fill="#9ed8cf"/><circle cx="58" cy="30" r="12" fill="#113331"/></g>
      <g transform="translate(420 264)"><path d="M44 0L116 30L72 60L0 30Z" fill="#d2edf2" stroke="#76b8c4"/><path d="M0 30L72 60V100L0 70Z" fill="#a3d3dc"/><rect x="46" y="18" width="24" height="24" rx="4" fill="#113331"/></g>
      <g transform="translate(92 470)"><path d="M44 0L116 30L72 60L0 30Z" fill="#dfefc9" stroke="#9cb970"/><path d="M0 30L72 60V100L0 70Z" fill="#c0dc98"/><path d="M45 38L58 18L71 38Z" fill="#113331"/></g>
      <g transform="translate(420 656)"><path d="M44 0L116 30L72 60L0 30Z" fill="#c9eee0" stroke="#6eb695" stroke-width="2"/><path d="M0 30L72 60V100L0 70Z" fill="#9ed9bf"/><path d="M42 23H74V42H56L47 50L50 42H42Z" fill="#113331"/></g>
    </g>
    <g fill="#113331" font-size="19" font-weight="750"><text x="230" y="158">PHYSICS</text><text x="275" y="302">BLACKROCK</text><text x="230" y="508">CLIMB</text><text x="275" y="694">RESIDESK</text></g>
    <g fill="#4e6b67" font-size="15" font-weight="700" letter-spacing="1"><text x="230" y="182">MEASURE</text><text x="275" y="326">EARN TRUST</text><text x="230" y="532">MEASURE OUTCOMES</text><text x="275" y="718">LISTEN CLOSELY</text></g>
    <rect x="174" y="804" width="292" height="54" rx="27" fill="#f8fcfb" stroke="#9acdc7"/><text x="320" y="838" text-anchor="middle" fill="#113331" font-size="18" font-weight="700">Make the real job easier</text>
  </g>
</svg>
